<div class="tabs" role="tablist">
  @for (option of options; track option.value) {
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="gender() === option.value"
      [class.active]="gender() === option.value"
      (click)="gender.set(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
