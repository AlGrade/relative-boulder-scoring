<div class="tabs" role="group" [attr.aria-label]="label()">
  @for (option of options(); track option.id) {
    <button
      type="button"
      [class.active]="selected() === option.id"
      [attr.aria-pressed]="selected() === option.id"
      (click)="selected.set(option.id)"
    >
      {{ option.label }}
    </button>
  }
</div>
