<header class="greeting">
  <h1>Hallo, {{ firstName() }}!</h1>
  <button type="button" class="link" (click)="logout()">Ausloggen</button>
</header>

<div class="separator"></div>

<app-tabs [options]="tabs" [(selected)]="tab" label="Ansicht" />

<section>
  @switch (tab()) {
    @case ('boulders') {
      <app-boulder-list />
    }
    @case ('ranking') {
      <app-ranking />
    }
    @case ('points') {
      <app-boulder-points />
    }
  }
</section>
