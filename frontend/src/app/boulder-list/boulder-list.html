@if (boulders.isLoading()) {
  <app-loading />
} @else if (boulders.value().length === 0) {
  <p class="hint">Es sind noch keine Boulder eingetragen.</p>
} @else {
  @if (failure()) {
    <p class="hint error centered save-failed" role="alert">{{ failure() }}</p>
  }
  <div class="boulder-head">
    <span>Boulder</span>
    <span>Geschafft</span>
    <span>Geflasht</span>
  </div>
  <ul class="boulders">
    @for (boulder of boulders.value(); track boulder.id) {
      <li>
        <span class="number">B{{ boulder.number }}</span>
        <button
          type="button"
          class="toggle sent"
          [class.on]="isSent(boulder.number)"
          [attr.aria-pressed]="isSent(boulder.number)"
          [attr.aria-label]="'Boulder ' + boulder.number + ' geschafft'"
          title="Als geschafft markieren"
          (click)="toggleSent(boulder.number)"
        >
          <span aria-hidden="true">✓</span>
        </button>
        <button
          type="button"
          class="toggle flash"
          [class.on]="isFlashed(boulder.number)"
          [attr.aria-pressed]="isFlashed(boulder.number)"
          [attr.aria-label]="'Boulder ' + boulder.number + ' geflasht'"
          title="Als geflasht markieren"
          (click)="toggleFlashed(boulder.number)"
        >
          <span aria-hidden="true">⚡</span>
        </button>
      </li>
    }
  </ul>
}
