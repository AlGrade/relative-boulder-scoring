<header class="hero">
  <h1>Boulder Contest</h1>
</header>

<section class="card">
  <div class="tabs" role="tablist">
    <button
      type="button"
      role="tab"
      [class.active]="mode() === 'login'"
      [attr.aria-selected]="mode() === 'login'"
      (click)="setMode('login')"
    >
      Login
    </button>
    <button
      type="button"
      role="tab"
      [class.active]="mode() === 'register'"
      [attr.aria-selected]="mode() === 'register'"
      (click)="setMode('register')"
    >
      Registrierung
    </button>
  </div>

  @if (busy()) {
    <app-loading />
  } @else if (mode() === 'login') {
    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <label>
        Name
        <input
          type="text"
          formControlName="name"
          autocomplete="username"
          [attr.aria-invalid]="!!loginError('name')"
        />
        @if (loginError('name'); as message) {
          <small class="hint error">{{ message }}</small>
        }
      </label>
      <label>
        Passwort
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="!!loginError('password')"
        />
        @if (loginError('password'); as message) {
          <small class="hint error">{{ message }}</small>
        }
      </label>
      <button type="submit" class="primary" [disabled]="busy()">Einloggen</button>
    </form>
  } @else {
    <form [formGroup]="registerForm" (ngSubmit)="submitRegister()">
      <label>
        Name
        <input
          type="text"
          formControlName="name"
          placeholder="Vorname Nachname"
          autocomplete="username"
          [attr.aria-invalid]="!!registerError('name')"
        />
        @if (registerError('name'); as message) {
          <small class="hint error">{{ message }}</small>
        }
      </label>
      <label>
        Geschlecht
        <select formControlName="gender" [attr.aria-invalid]="!!registerError('gender')">
          <option value="">Bitte wählen</option>
          @for (option of genders; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        @if (registerError('gender'); as message) {
          <small class="hint error">{{ message }}</small>
        }
      </label>
      <label>
        Passwort wählen
        <input
          type="password"
          formControlName="password"
          placeholder="Wähle dein eigenes Passwort"
          autocomplete="new-password"
          [attr.aria-invalid]="!!registerError('password')"
        />
        @if (registerError('password'); as message) {
          <small class="hint error">{{ message }}</small>
        }
      </label>
      <button type="submit" class="primary" [disabled]="busy()">Registrieren</button>
    </form>
  }

  @if (error()) {
    <p class="hint error">{{ error() }}</p>
  }
</section>

<section class="public-ranking">
  <button
    type="button"
    class="disclosure"
    aria-controls="public-ranking-panel"
    [attr.aria-expanded]="showRanking()"
    (click)="showRanking.set(!showRanking())"
  >
    Ranking
    <span class="arrow" [class.open]="showRanking()" aria-hidden="true">▼</span>
  </button>
  <!-- Always in the DOM so aria-controls above resolves even while collapsed. -->
  <div id="public-ranking-panel" class="panel">
    @if (showRanking()) {
      <app-ranking />
    }
  </div>
</section>
