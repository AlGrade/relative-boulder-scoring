<header class="hero">
  <h1>Relative Boulder Scoring</h1>
  <p>Ein Boulder ist umso mehr wert, je weniger Leute ihn geschafft haben.</p>
</header>

<section class="card">
  <div class="tabs" role="tablist">
    <button
      type="button"
      role="tab"
      [class.active]="mode() === 'login'"
      [attr.aria-selected]="mode() === 'login'"
      (click)="setMode('login')"
    >
      Login
    </button>
    <button
      type="button"
      role="tab"
      [class.active]="mode() === 'register'"
      [attr.aria-selected]="mode() === 'register'"
      (click)="setMode('register')"
    >
      Registrierung
    </button>
  </div>

  @if (mode() === 'login') {
    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <label>
        Name
        <input type="text" formControlName="name" autocomplete="username" />
      </label>
      <label>
        Passwort
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>
      <button type="submit" class="primary" [disabled]="busy()">Einloggen</button>
    </form>
  } @else {
    <form [formGroup]="registerForm" (ngSubmit)="submitRegister()">
      <label>
        Name
        <input
          type="text"
          formControlName="name"
          placeholder="Vorname Nachname"
          autocomplete="username"
        />
      </label>
      <label>
        Wertung
        <select formControlName="gender">
          <option value="">Bitte wählen</option>
          @for (option of genders; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </label>
      <label>
        Passwort
        <input type="password" formControlName="password" autocomplete="new-password" />
        <small class="hint">Mindestens 6 Zeichen.</small>
      </label>
      <button type="submit" class="primary" [disabled]="busy()">Registrieren</button>
    </form>
  }

  @if (error()) {
    <p class="hint error">{{ error() }}</p>
  }
</section>

<section class="card">
  <button type="button" class="disclosure" (click)="showRanking.set(!showRanking())">
    Ranking
    <span aria-hidden="true">{{ showRanking() ? '▲' : '▼' }}</span>
  </button>
  @if (showRanking()) {
    <app-ranking />
  }
</section>
