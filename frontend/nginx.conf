worker_processes auto;
worker_rlimit_nofile 2048;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format container '$remote_addr - $request_method $uri $status $body_bytes_sent '
                         'rt=$request_time ua="$http_user_agent"';
    access_log /dev/stdout container;

    # The image runs with a read-only root filesystem. Every nginx scratch path lives in
    # the small, no-exec tmpfs supplied by Compose.
    client_body_temp_path /tmp/client-body 1 2;
    proxy_temp_path /tmp/proxy 1 2;
    fastcgi_temp_path /tmp/fastcgi 1 2;
    uwsgi_temp_path /tmp/uwsgi 1 2;
    scgi_temp_path /tmp/scgi 1 2;

    client_max_body_size 32k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        image/svg+xml
        text/css
        text/plain;

    # cloudflared terminates the tunnel and sets this; the default covers a direct
    # loopback call during a smoke test, where the app must still consider itself
    # behind HTTPS or Spring would drop the Secure cookie flag.
    map $http_x_forwarded_proto $forwarded_proto {
        default "https";
        "~^(http|https)$" $http_x_forwarded_proto;
    }

    # Docker's embedded DNS. Resolving the backend at request time rather than at
    # startup is what lets the backend container be recreated - which every switch
    # between competition and off-season mode does - without nginx holding on to the
    # old container's address and answering 502 until it is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

        # Answered here, not proxied: this container's own ability to serve is what the
        # healthcheck asks about.
        location = /healthz {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"ok":true}';
        }

        location ^~ /api/ {
            # Via a variable so the resolver above is actually used; $request_uri keeps
            # path and query exactly as the client sent them.
            set $upstream "backend:8080";
            proxy_pass http://$upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # A ranking is only worth reading if it is current.
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Angular builds with outputHashing: all, so every js/css filename changes when
        # its content does and the old name is never reused.
        location ~* \.(?:js|css)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            # A location-level add_header drops everything inherited from the server
            # block, so the hardening headers have to be repeated here.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        }

        # Angular's client-side routes are served by index.html, which must never be
        # cached across a deploy or the browser keeps loading a bundle that is gone.
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
