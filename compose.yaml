services:
  postgres:
    image: 'postgres:18'
    container_name: rbs-postgres
    environment:
      POSTGRES_DB: boulderscoring
      POSTGRES_USER: boulderscoring
      POSTGRES_PASSWORD: boulderscoring
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ expects the mount on /var/lib/postgresql (not .../data) so that
      # later pg_upgrade steps across major versions keep working.
      - rbs-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boulderscoring -d boulderscoring']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rbs-postgres-data:
