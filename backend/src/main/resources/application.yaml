spring:
  application:
    name: relative-boulder-scoring

  # Spring Boot starts the Postgres container from the repo root automatically once
  # the app runs in dev mode and points the datasource at it.
  docker:
    compose:
      enabled: true
      file: ../compose.yaml
      lifecycle-management: start_only

  jpa:
    open-in-view: false
    # Makes demo-data.sql run only after Hibernate has created the tables.
    defer-datasource-initialization: true
    hibernate:
      # Dev setup: Hibernate derives the schema from the entities.
      # Once the data model has settled, switch to validate and run
      # schema changes through a migration tool.
      ddl-auto: update
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # Sample round for local development (see demo-data.sql). The script is idempotent
  # and runs along on every start; set this to never for a real competition.
  sql:
    init:
      mode: always
      data-locations: classpath:demo-data.sql

  mvc:
    problemdetails:
      # Errors come back as an RFC 9457 body, bean validation failures included.
      enabled: true

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
