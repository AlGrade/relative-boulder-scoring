spring:
  application:
    name: relative-boulder-scoring

  # Spring Boot startet den Postgres-Container aus dem Repo-Root automatisch,
  # sobald die App im Dev-Modus laeuft, und leitet die Datasource darauf um.
  docker:
    compose:
      enabled: true
      file: ../compose.yaml
      lifecycle-management: start_only

  jpa:
    open-in-view: false
    # Damit demo-data.sql erst laeuft, wenn Hibernate die Tabellen angelegt hat.
    defer-datasource-initialization: true
    hibernate:
      # Dev-Setup: Hibernate zieht das Schema aus den Entities nach.
      # Sobald das Datenmodell steht, auf validate umstellen und
      # Schema-Aenderungen ueber ein Migrationstool fahren.
      ddl-auto: update
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # Beispiel-Runde fuer die lokale Entwicklung (siehe demo-data.sql). Das Skript ist
  # idempotent und laeuft bei jedem Start mit; fuer einen echten Wettkampf hier auf
  # never stellen.
  sql:
    init:
      mode: always
      data-locations: classpath:demo-data.sql

  mvc:
    problemdetails:
      # Fehler kommen als RFC-9457-Body zurueck, auch Bean-Validation-Verstoesse.
      enabled: true

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
